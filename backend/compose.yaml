services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: library_management
      MYSQL_USER: library_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your shell}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - library_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/library_management?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: library_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,demo}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_LIBRARIAN_PASSWORD: ${DEMO_LIBRARIAN_PASSWORD:-}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-}
      COVERS_DIR: /app/data/covers
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/covers:/app/data/covers
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/policy"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped
  reader:
    build:
      context: ../frontend
      args:
        PORTAL: reader
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  librarian:
    build:
      context: ../frontend
      args:
        PORTAL: librarian
    ports:
      - "127.0.0.2:5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  admin:
    build:
      context: ../frontend
      args:
        PORTAL: admin
    ports:
      - "127.0.0.3:5175:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  library_mysql_data:
